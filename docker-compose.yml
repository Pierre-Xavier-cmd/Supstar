services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/supstar
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "5000:5000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5173:4173"

volumes:
  mongo_data:
